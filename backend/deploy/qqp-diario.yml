# Plantilla: copiar a <raiz del repositorio>/.github/workflows/qqp-diario.yml
# Requiere secretos del repositorio: DATABASE_URL (base accesible desde internet) y, opcional, GOOGLE_MAPS_API_KEY.
# Variable opcional del repositorio: QQP_CONTACTO (correo del equipo).
# GitHub envia correo al dueno del repositorio cuando el flujo falla (codigo de salida 1 = fallo o carga parcial).
name: Sincronizacion diaria Profeco QQP

on:
  schedule:
    - cron: '17 13 * * *' # 07:17 en Morelia (UTC-6). GitHub puede retrasar las ejecuciones programadas.
  workflow_dispatch: {}

concurrency:
  group: qqp-diario
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run etl:qqp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          QQP_CONTACTO: ${{ vars.QQP_CONTACTO }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qqp-respaldo
          path: backend/datos/qqp-api/
          retention-days: 30
